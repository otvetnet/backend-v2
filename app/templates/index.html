<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Certificate</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }
        @font-face {
            font-family: "Raleway";
            src: url("assets/fonts/Raleway-Regular.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: "Raleway";
            src: url("assets/fonts/Raleway-Medium.woff2") format("woff2");
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: "Raleway";
            src: url("assets/fonts/Raleway-SemiBold.woff2") format("woff2");
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: "Raleway";
            src: url("assets/fonts/Raleway-Bold.woff2") format("woff2");
            font-weight: 700;
            font-style: normal;
        }

        body {
            font-family: "Raleway", sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: {{ bg_color }};
        }
        main {
            display: flex;
            flex-direction: column;
            min-height: 1000px;
            width: 100%;
        }

        .cover {
            padding: 30px 30px 0 30px;
            page-break-inside: avoid;
        }
        .cover__inner {
            border-top: 20px solid white;
            border-right: 20px solid white;
            border-left: 20px solid white;
            padding-top: 80px;
            padding-left: 15px;
            padding-right: 15px;
        }
        .cover__title {
            display: flex;
            margin-bottom: 40px;
            justify-content: center;
        }
        .cover__title img {
            display: block;
            margin: 0 auto;
        }

        .cover__decorations {
            display: flex;
            justify-content: space-between;
            position: relative;
            width: 100%;
        }
        .cover__decorations-figures {
            position: absolute;
            right: 0;
            top: 0;
        }

        .information {
            position: relative;
            background-color: white;
            background-image: url("assets/info-decoration.svg");
            padding: 30px 30px 100px 30px;
            padding-top: 70px;
            flex-grow: 1;
            gap: 20px;
            display: flex;
            flex-direction: column;
            page-break-inside: avoid;
        }
        .information::before {
            content: "";
            position: absolute;
            width: 100%;
            background-size: cover;
            left: 0;
            bottom: 100%;
            height: 120px;
            background-image: url('assets/section-transition.svg');
            background-repeat: no-repeat;
        }
        .information__separator {
            background-color: lightgray;
            width: 50px;
            height: 3px;
        }
        .information__main {
            display: flex;
            gap: 30px;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }
        .information__fullname {
            font-size: 36px;
            font-weight: 700;
        }
        .information__description {
            font-size: 22px;
            text-align: center;
            max-width: 700px;
        }
        .information__bottom {
            max-width: 700px;
            padding-top: 50px;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .information__partners {
            padding-left: 40px;
        }
        .information__partners img {
            margin-right: 40px;
        }
        .information__partners img:last-child {
            margin-right: 0;
        }
        .information__signatures img {
            max-height: 60px;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <main>
        <section class="cover">
            <div class="cover__inner">
                <div class="cover__title">
                    <img src="assets/title.svg" style="height:65px; max-width:90%;" alt="">
                </div>
                <div class="cover__decorations">
                    <img src="assets/people.png" style="height:320px; width:auto; display:block; margin:0;" alt="">
                    <div class="cover__decorations-figures">
                        <svg width="250" height="320" viewBox="0 0 527 550" fill="none"
                            xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M209 119L240.796 222.844L321.994 153.21L294.294 258.294L399.113 244.978L320.711 317.939L415.873 365.169L311.661 382.842L366.952 475.622L270.017 432.397L267.882 541.271L209 450.87L150.118 541.271L147.983 432.397L51.0483 475.622L106.339 382.842L2.12732 365.169L97.2888 317.939L18.8869 244.978L123.706 258.294L96.0061 153.21L177.204 222.844L209 119Z"
                                fill="{{ svg_color1 }}" />
                            <path
                                d="M417.5 0L429.114 101.015L527 113L429.114 124.985L417.5 226L405.886 124.985L308 113L405.886 101.015L417.5 0Z"
                                fill="{{ svg_color2 }}" />
                            <path
                                d="M265 24L287.627 33.6655L297 57L287.627 80.3345L265 90L242.373 80.3345L233 57L242.373 33.6655L265 24Z"
                                fill="{{ svg_color3 }}" />
                        </svg>
                    </div>
                </div>
            </div>
        </section>
        <section class="information">
            <div class="information__main">
                <div class="information__fullname">{{ last_name }} {{ first_name }}</div>
                <div class="information__separator"></div>
                <div class="information__description">
                    <p>
                        За успешное прохождение игры <b>“{{ game_name }}”</b> в симуляторе по отработке негативного
                        поведения “<span style="color: #003087">Ответ</span><span style="color: #01AB40">Нет</span>”
                    </p>
                </div>
            </div>
            <div class="information__bottom">
                <div class="information__partners">
                    <img src="assets/partners/1.png" style="max-height:40px; min-height: 40px;" alt="">
                    <img src="assets/partners/2.png" style="max-height:40px; min-height: 40px;" alt="">
                    <img src="assets/partners/3.png" style="max-height:40px; min-height: 40px;" alt="">
                </div>
                <div class="information__signatures">
                    <img src="assets/signatures/print-mark.png" style="min-height:120px;" alt="">
                    <img src="assets/signatures/signature.png" style="min-height:75px;" alt="">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
